name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci, not `--omit=dev` — astro, tailwind and the build tooling all
      # live in devDependencies.
      - run: npm ci
      # Runs even though lefthook covers these locally; --no-verify bypasses it.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
