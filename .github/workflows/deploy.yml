name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Compute release tag
        id: tag
        run: echo "value=v$(date -u +'%Y.%m.%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # npm ci, not `--omit=dev` — astro, tailwind and the build tooling all
      # live in devDependencies.
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_RELEASE_TAG: ${{ steps.tag.outputs.value }}
          # No fallback. A missing secret must fail the deploy.
          PUBLIC_SUBSCRIBE_URL: ${{ secrets.SUBSCRIBE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Runs after deploy-pages so a release only exists for what shipped.
      - name: Create release
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Deployed from ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
