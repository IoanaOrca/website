pre-commit:
  jobs:
    - name: format
      run: npm run format
      stage_fixed: true
    - name: lint
      run: npm run lint:fix
      stage_fixed: true

pre-push:
  jobs:
    - name: check
      run: npm run check

commit-msg:
  jobs:
    - name: conventional-commit
      run: 'grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+" {1} || { echo "Commit message must follow Conventional Commits: <type>(<scope>): <description>"; exit 1; }'
